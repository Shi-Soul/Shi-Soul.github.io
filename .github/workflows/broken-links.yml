name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!**_example/**"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # --offline: 只查站内相对链接；外链（论文、Scholar、X 等）逐个联网检查会被限流/拒绝，每次 push 都随机失败
          # removed md files that include liquid tags (agent/index.html、_pages/404.md 的链接是 Liquid 模板)
          args: --offline --exclude-path FAQ.md --exclude-path _pages/404.md --exclude-path agent/index.html --exclude-path agent/evaluation/index.html --exclude-path README.md --exclude-path CUSTOMIZE.md --exclude-path _pages_example/blog.md --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --verbose --no-progress './**/*.md' './**/*.html'

      - name: Report broken links 📋
        # 日志需要登录才能看；把 lychee 结果写进 annotation，公开 API 可读
        if: failure()
        run: |
          msg=$(grep -E '^\* \[' lychee/out.md | head -80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Broken links::${msg}"
