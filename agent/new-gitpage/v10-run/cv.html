<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="run" href="index.html"><span class="live" aria-hidden="true"></span>Weiji Xie</a>
  <div class="meta"><span>run summary</span></div>
  <nav aria-label="Site"><a href="index.html#logs">logs</a><a href="index.html#checkpoints">checkpoints</a><a href="cv.html" aria-current="page">cv</a></nav>
</div></header>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="k" data-reveal>curriculum vitae · run summary</div>
      <h1 data-reveal style="--d:1">Weiji Xie</h1>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </div>
    <div class="card-id" data-reveal style="--d:2">
      <div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div>
      <dl><dt>owner</dt><dd>Weiji Xie</dd><dt>org</dt><dd>SJTU · TeleAI</dd><dt>base</dt><dd>Shanghai</dd><dt>since</dt><dd>2021-09</dd></dl>
    </div>
  </section>

  <div class="panel summary" data-reveal id="summary"></div>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← back to run</a></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links } = Site, $ = (id) => document.getElementById(id);
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  $("photo").style.backgroundImage = `url(${P.photo})`;
  const pubs = S.publications;
  $("summary").innerHTML = [[pubs.length, "papers"], [pubs.filter((p) => p.authors.startsWith("Weiji Xie")).length, "first / co-first"], [pubs.filter(isTop).length, "accepted"], ["4.03", "B.Eng. GPA / 4.30"]].map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("");
  const row = (r) => `<div class="r"><time>${esc(r.when || "")}</time><div>${esc(r.title)}${r.org ? `<small>${esc(r.org)}</small>` : ""}${r.detail ? `<small>${esc(r.detail)}</small>` : ""}</div></div>`;
  const sec = (t, sub, body) => `<section class="blk"><div class="sh" data-reveal><h2>${t}</h2><span>${sub}</span></div><div class="panel rows" data-reveal>${body}</div></section>`;
  const b = Site.cvBlocks();
  const plist = pubs.map((p) => `<div class="cvp" data-hover>${media(p)}<div>${esc(p.title)}<small>${me(p.authors)}</small><small>ckpt_${p.date || p.year} · ${esc(venue(p))}<span class="ln">${links(p)}</span></small></div></div>`).join("");
  $("cv").innerHTML = sec(b[0].title, "education", b[0].rows.map(row).join("")) + sec(b[1].title, "experience", b[1].rows.map(row).join("")) +
    sec("Publications", "all checkpoints", plist) + b.slice(2).map((x) => sec(x.title, x.id, x.rows.map(row).join(""))).join("");
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
