<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="page">
  <a class="sig" href="index.html">Weiji Xie ✎</a>
  <nav aria-label="Site"><a href="index.html#news">news</a><a href="index.html#publications">publications</a><a href="cv.html" aria-current="page">cv</a></nav>
</div></header>

<main class="page">
  <section class="cvhead">
    <div>
      <div class="tagline" data-reveal>curriculum vitae</div>
      <h1 data-reveal style="--d:1">Weiji Xie</h1>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </div>
    <div class="passport"><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
  </section>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← back home</a></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const paths = ["M2 9 C 25 3, 50 13, 98 5", "M2 6 C 30 12, 60 2, 98 8", "M2 8 C 30 3, 70 12, 98 6"];
  const h2 = (t, i) => `<h2 data-reveal><span class="u">${t}<svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><path d="${paths[i % 3]}"/></svg></span></h2>`;
  const row = (r) => `<div class="cvrow"><time>${esc(r.when || "")}</time><div>${esc(r.title)}${r.org ? `<small>${esc(r.org)}</small>` : ""}${r.detail ? `<small>${esc(r.detail)}</small>` : ""}</div></div>`;
  const sec = (t, body, i) => `<section class="cvsec">${h2(t, i)}<div data-reveal style="--d:1">${body}</div></section>`;
  const b = Site.cvBlocks();
  const pubs = S.publications.map((p) => `<div class="cvpub" data-hover>${media(p)}<div>${esc(p.title)}<small>${me(p.authors)}</small><small>${esc(venue(p))}<span class="acts">${links(p, { project: "project ↗", pdf: "paper ↗" })}</span></small></div></div>`).join("");
  $("cv").innerHTML = sec(b[0].title, b[0].rows.map(row).join(""), 0) + sec(b[1].title, b[1].rows.map(row).join(""), 1) + sec("Publications", pubs, 2) +
    b.slice(2).map((x, i) => sec(x.title, x.rows.map(row).join(""), i)).join("");
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
