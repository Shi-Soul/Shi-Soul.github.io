<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie · Research Atlas</title>
<meta name="description" content="Weiji Xie: humanoid whole-body control, reinforcement learning, robotics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<style>
:root {
  --bg: #f7f7f4; --card: #fff; --card2: #f0f0ec; --ink: #121212; --ink2: #3f3f3c; --muted: #7b7b75; --line: #e4e4de;
  --blue: #2b4cff; --blue-soft: #e6eaff; --orange: #ff6a2b;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --sans: "Inter", system-ui, -apple-system, "PingFang SC", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --pm-bg: var(--card2); --pm-ph-bg: linear-gradient(135deg, var(--blue-soft), var(--card2)); --pm-ph-ink: var(--blue);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e0f11; --card: #17181b; --card2: #1f2024; --ink: #f1f1ee; --ink2: #c9c9c3; --muted: #8b8b85; --line: #2a2b30; --blue: #7d93ff; --blue-soft: #1d2340; --orange: #ff8a57; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e0f11; --card: #17181b; --card2: #1f2024; --ink: #f1f1ee; --ink2: #c9c9c3; --muted: #8b8b85; --line: #2a2b30; --blue: #7d93ff; --blue-soft: #1d2340; --orange: #ff8a57; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
.top { display: flex; align-items: center; gap: 12px; padding: 22px 0; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 14px var(--display); }
.top .name { font: 600 15px var(--display); }
.theme { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }

.hero { padding: 40px 0 28px; }
.hero h1 { font: 700 clamp(40px, 6.2vw, 78px)/1.03 var(--display); letter-spacing: -.035em; margin: 0; max-width: 1000px; }
.hero h1 .av { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: #fff center 22% / 160% no-repeat; vertical-align: -0.12em; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
.hl { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--orange) 38%, transparent) 62%); }
.blue { color: var(--blue); }
.hero p { font-size: 17px; color: var(--ink2); max-width: 680px; margin: 20px 0 0; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.pills a, .pills button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; }
.pills a:hover, .pills button:hover { border-color: var(--blue); text-decoration: none; }
.pills a:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.bento { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr; gap: 14px; margin-top: 18px; }
.cell { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; min-width: 0; }
.cell h3 { margin: 0 0 10px; font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stats h3 { grid-column: span 2; color: color-mix(in srgb, var(--bg) 60%, transparent); margin: 0; }
.stat b { display: block; font: 700 36px/1 var(--display); letter-spacing: -.03em; }
.stat span { font-size: 12.5px; opacity: .7; }
.cv-cell dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.cv-cell dt { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
.cv-cell dd { margin: 0; }
.news ul { list-style: none; margin: 0; padding: 0; }
.news li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 5px 0; font-size: 14px; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; }
.news time { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }

.sec { padding: 60px 0 0; }
.sec h2 { margin: 0 0 18px; font: 700 clamp(28px, 3.6vw, 40px)/1 var(--display); letter-spacing: -.03em; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
.pcard:hover { transform: translateY(-3px); box-shadow: 0 18px 40px -22px rgba(0,0,0,.35); }
.pcard .pm { aspect-ratio: 16 / 10; }
.pbody { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
.venue { font: 600 11.5px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); align-self: flex-start; }
.venue.top { background: var(--orange); color: #fff; }
.pcard h3 { font: 650 22px/1.15 var(--display); margin: 10px 0 4px; letter-spacing: -.015em; }
.pcard .note { color: var(--ink2); margin: 0 0 14px; font-size: 14.5px; }
.pcard .ln { margin-top: auto; display: flex; gap: 8px; }
.pcard .ln a, .olist .ln a { font: 500 12.5px var(--sans); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; color: var(--ink); }
.pcard .ln a:hover, .olist .ln a:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
.olist { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 22px; }
.olist > div { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.olist > div:first-child { border-top: 0; }
.olist .v { font: 12px var(--mono); color: var(--muted); }
.olist .t { font-weight: 600; font-size: 14.5px; }
.olist .au { display: block; font-size: 12.5px; color: var(--muted); }
.olist .me { color: var(--ink); }
.olist .ln { display: flex; gap: 6px; }
footer { margin-top: 64px; border-top: 1px solid var(--line); padding: 26px 0 56px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 13.5px; }

@media (max-width: 960px) { .bento { grid-template-columns: 1fr 1fr; } .news { grid-column: span 2; } .cards { grid-template-columns: 1fr 1fr; } .olist > div { grid-template-columns: 1fr; gap: 4px; } }
@media (max-width: 600px) { .wrap { padding: 0 16px; } .bento, .cards { grid-template-columns: 1fr; } .news { grid-column: auto; } }
@media (prefers-reduced-motion: reduce) { .pcard, .pcard:hover { transition: none; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo" aria-hidden="true">WX</div><span class="name">Weiji Xie · 谢炜基</span><button class="theme" id="theme" type="button" aria-label="Toggle dark mode">◐</button></header>

  <section class="hero">
    <h1>Hi, I'm Weiji <span class="av" id="av" role="img" aria-label="Photo of Weiji"></span>. I teach <span class="hl">humanoid robots</span> to <span class="blue">balance</span>, <span class="blue">fight</span>, <span class="blue">dance</span> and <span class="blue">listen</span>.</h1>
    <p id="bio"></p>
    <div class="pills" id="contacts"></div>
  </section>

  <section class="bento" aria-label="At a glance">
    <div class="cell stats"><h3>By the numbers</h3><div class="stat"><b id="n-pub"></b><span>papers</span></div><div class="stat"><b id="n-first"></b><span>first / co-first</span></div><div class="stat"><b id="n-top"></b><span>accepted (NeurIPS · IROS · AAAI)</span></div><div class="stat"><b id="n-year"></b><span>latest work</span></div></div>
    <div class="cell cv-cell"><h3>Path</h3><dl id="cv"></dl></div>
    <div class="cell news"><h3>News</h3><ul id="news"></ul></div>
  </section>

  <section class="sec" id="work">
    <h2>Main work</h2>
    <div class="cards" id="cards"></div>
    <div class="olist" id="others" aria-label="Other work"></div>
  </section>

  <footer><span>© <span id="yr"></span> Weiji Xie · hand-built, no template</span><a id="cv-link" href="#">Full CV →</a></footer>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links } = Site, $ = (id) => document.getElementById(id);
  $("av").style.backgroundImage = `url(${P.photo})`;
  $("bio").innerHTML = P.bio;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  $("cv-link").href = P.cv;
  const pubs = S.publications;
  $("n-pub").textContent = pubs.length;
  $("n-first").textContent = pubs.filter((p) => p.authors.startsWith("Weiji Xie")).length;
  $("n-top").textContent = pubs.filter(isTop).length;
  $("n-year").textContent = Math.max(...pubs.map((p) => p.year));
  $("cv").innerHTML = S.cv.map((c) => `<dt>${c.when}</dt><dd>${esc(c.what)}</dd>`).join("");
  $("news").innerHTML = S.news.map((n) => `<li><time>${n.date}</time><span>${esc(n.text)}</span></li>`).join("");
  const v = (p) => `<span class="venue ${isTop(p) ? "top" : ""}">${esc(venue(p))}</span>`;
  $("cards").innerHTML = Site.main().map((p) => `<article class="pcard" data-hover>${media(p)}<div class="pbody">${v(p)}<h3 title="${esc(p.title)}">${esc(p.short)}</h3><p class="note">${esc(p.note)}</p><div class="ln">${links(p, { project: "Project ↗", pdf: "Paper ↗" })}</div></div></article>`).join("");
  $("others").innerHTML = Site.others().map((p) => `<div><span class="v">${esc(venue(p))}</span><span><span class="t">${esc(p.title)}</span><span class="au">${me(p.authors)}</span></span><span class="ln">${links(p)}</span></div>`).join("");
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.themeToggle($("theme"));
})();
</script>
</body>
</html>
