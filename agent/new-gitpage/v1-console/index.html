<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie · Control Room</title>
<meta name="description" content="Weiji Xie: humanoid whole-body control, reinforcement learning, robotics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<style>
:root {
  --bg: #0b0c0d; --panel: #111315; --panel2: #15181b; --line: #23272c; --line2: #2f353b;
  --ink: #e8e7e3; --muted: #8d939a; --dim: #5d636a; --amber: #ffb224; --cyan: #58d3e8;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Space Grotesk", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --pm-bg: #1a1d21; --pm-ph-bg: repeating-linear-gradient(135deg, #15181b 0 10px, #181b1f 10px 20px); --pm-ph-ink: #5d636a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 70%); pointer-events: none; z-index: -1; }
a { color: var(--amber); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 22px; height: 50px; font: 12px var(--mono); }
.bar .id { color: var(--ink); font-weight: 700; } .bar .id span { color: var(--amber); }
.bar nav { display: flex; gap: 18px; margin-left: auto; } .bar nav a { color: var(--muted); }
.bar .status { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; padding: 64px 0 56px; }
.tag { font: 12px var(--mono); color: var(--amber); }
h1 { font-size: clamp(44px, 7vw, 80px); line-height: .95; margin: 16px 0 0; letter-spacing: -.045em; }
.zh { font: 500 15px var(--mono); letter-spacing: .2em; color: var(--muted); margin-top: 12px; }
.op { display: flex; gap: 16px; align-items: center; margin: 28px 0 0; padding: 12px; border: 1px solid var(--line2); background: var(--panel); border-radius: 6px; max-width: 520px; }
.op .ph { width: 74px; height: 96px; flex: none; background: #f2f2ef center 18% / cover; border-radius: 3px; position: relative; overflow: hidden; }
.op .ph::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 3px, rgba(0,0,0,.06) 3px 4px); }
.op .k { font: 10px var(--mono); color: var(--dim); letter-spacing: .1em; }
.op p { margin: 4px 0 0; font-size: 14px; color: #c9c8c3; }
.op p a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line2); }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.contacts a, .contacts button { font: 12px var(--mono); color: var(--ink); border: 1px solid var(--line2); background: var(--panel); padding: 8px 11px; border-radius: 3px; display: inline-flex; gap: 8px; align-items: center; }
.contacts a:hover, .contacts button:hover { border-color: var(--amber); color: var(--amber); text-decoration: none; }
.contacts a:first-child { background: var(--amber); color: #111; border-color: var(--amber); font-weight: 700; }

.console { border: 1px solid var(--line2); background: var(--panel); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(255,178,36,.18); }
.console-head { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); }
.console-head b { color: var(--amber); font-weight: 500; }
.stage { --demo-fg: #e8e7e3; --demo-accent: #ffb224; --demo-muted: #8d939a; --demo-grid: #2a2f35; --demo-font: "JetBrains Mono", monospace; flex: 1; min-height: 300px; background: radial-gradient(ellipse at 50% 70%, #1a1d21, var(--panel)); }
.cmd { display: flex; border-top: 1px solid var(--line); }
.cmd label { font: 13px var(--mono); color: var(--amber); padding: 11px 0 11px 14px; }
.cmd input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--ink); font: 13px var(--mono); padding: 11px; }
.cmd input::placeholder { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.chips button { font: 11px var(--mono); background: var(--panel2); border: 1px solid var(--line); color: var(--muted); padding: 4px 8px; border-radius: 3px; cursor: pointer; }
.chips button:hover { color: var(--ink); }

section { padding: 52px 0; border-top: 1px solid var(--line); }
.sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
.sec-head .n { font: 12px var(--mono); color: var(--amber); }
.sec-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; font-weight: 600; }
.sec-head .note { margin-left: auto; font: 11px var(--mono); color: var(--dim); }

.mains { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { border: 1px solid var(--line2); background: var(--panel); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
.card .pm { aspect-ratio: 16 / 10; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
.badge { font: 700 10.5px var(--mono); color: #111; background: var(--amber); padding: 2px 7px; border-radius: 2px; align-self: flex-start; }
.badge.ur { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); font-weight: 500; }
.card h3 { font-size: 20px; margin: 10px 0 4px; font-weight: 600; letter-spacing: -.01em; }
.card .note { color: #c9c8c3; font-size: 14px; margin: 0 0 12px; }
.card .ln { margin-top: auto; display: flex; gap: 14px; font: 12px var(--mono); }

.others { margin-top: 26px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel); }
.other { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 12px 16px; border-top: 1px solid var(--line); }
.other:first-child { border-top: 0; }
.other .v { font: 11.5px var(--mono); color: var(--muted); }
.other b.t { font-weight: 600; }
.other .au { font-size: 12.5px; color: var(--dim); display: block; margin-top: 2px; }
.other .au .me, .card .me { color: var(--ink); font-weight: 600; }
.other .ln { font: 12px var(--mono); display: flex; gap: 12px; }

.log { font: 13px var(--mono); }
.log div { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 4px 0; }
.log .d { color: var(--dim); }

footer { padding: 32px 0 60px; border-top: 1px solid var(--line); font: 12px var(--mono); color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
footer .cv span { color: var(--muted); margin-right: 18px; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-top: 36px; }
  .mains { grid-template-columns: 1fr 1fr; }
  .bar nav { display: none; } .bar .status { margin-left: auto; }
  .other { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 560px) { .wrap { padding: 0 16px; } .mains { grid-template-columns: 1fr; } .log div { grid-template-columns: 70px 1fr; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="id" href="#top">WX<span>//</span>weiji</a>
  <nav aria-label="Sections"><a href="#work">work</a><a href="#log">log</a><a id="cv-top" href="#">cv</a></nav>
  <div class="status"><span class="dot" aria-hidden="true"></span><span id="clock">Shanghai</span></div>
</div></header>

<main class="wrap" id="top">
  <div class="hero">
    <div>
      <div class="tag" id="tagline"></div>
      <h1>Weiji<br>Xie</h1>
      <div class="zh">谢炜基</div>
      <div class="op">
        <div class="ph" id="photo" role="img" aria-label="Photo of Weiji Xie"></div>
        <div><div class="k">OPERATOR · CLEARANCE: HUMANOID</div><p id="bio"></p></div>
      </div>
      <div class="contacts" id="contacts"></div>
    </div>
    <div class="console" aria-label="Interactive humanoid sandbox">
      <div class="console-head"><span><b>LIVE</b> · type a command</span><span>sim 60 Hz</span></div>
      <div class="stage" id="stage"></div>
      <form class="cmd" id="cmd"><label for="cmd-in">›</label><input id="cmd-in" autocomplete="off" placeholder="wave both hands / spin kick / jump"></form>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <section id="work">
    <div class="sec-head"><span class="n">01</span><h2>Work</h2><span class="note">* equal contribution · † corresponding</span></div>
    <div class="mains" id="mains"></div>
    <div class="others" id="others"></div>
  </section>

  <section id="log">
    <div class="sec-head"><span class="n">02</span><h2>Log</h2></div>
    <div class="log" id="news"></div>
  </section>

  <footer><span class="cv" id="cv"></span><span>built by hand, no template</span></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/demos.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links, rest } = Site, $ = (id) => document.getElementById(id);
  $("tagline").textContent = "[ " + P.tagline.toLowerCase() + " ]";
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("bio").innerHTML = P.bio;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  $("cv-top").href = P.cv;

  const sand = Demos.mount($("stage"), "textop", { label: "Humanoid that follows typed commands" });
  const chips = ["walk forward", "wave both hands", "throw two punches", "spin kick", "jump up", "dance"];
  $("chips").innerHTML = chips.map((c) => `<button type="button">${c}</button>`).join("");
  $("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") sand.command(e.target.textContent); });
  $("cmd").addEventListener("submit", (e) => { e.preventDefault(); const v = $("cmd-in").value.trim(); if (v) { sand.command(v); $("cmd-in").value = ""; } });

  const badge = (p) => `<span class="badge ${isTop(p) ? "" : "ur"}">${esc(venue(p))}</span>`;
  $("mains").innerHTML = Site.main().map((p) => `<article class="card" data-hover>${media(p)}<div class="body">${badge(p)}<h3 title="${esc(p.title)}">${esc(p.short)}</h3><p class="note">${esc(p.note)}</p><div class="ln">${links(p)}</div></div></article>`).join("");
  $("others").innerHTML = Site.others().map((p) => `<div class="other"><span class="v">${esc(venue(p))}</span><span><b class="t">${esc(p.title)}</b><span class="au">${me(p.authors)}</span></span><span class="ln">${links(p)}</span></div>`).join("");
  $("news").innerHTML = S.news.map((n) => `<div><span class="d">${n.date}</span><span>${esc(n.text)}</span></div>`).join("");
  $("cv").innerHTML = S.cv.map((c) => `<span>${c.when} ${esc(c.what)}</span>`).join("") + `<a href="${P.cv}">full cv →</a>`;
  Site.init();

  const clock = () => { $("clock").textContent = "Shanghai " + new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit" }); };
  clock(); setInterval(clock, 30000);
})();
</script>
</body>
</html>
