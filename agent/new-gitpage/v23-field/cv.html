<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="flock" id="flock" aria-hidden="true"></canvas>
<div class="page">
  <header class="top"><a href="index.html" style="margin:0">Weiji Xie</a><nav aria-label="Site"><a href="index.html#now">Now</a><a href="index.html#work">Work</a><a href="cv.html" aria-current="page">CV</a></nav></header>
  <div class="col">
    <section class="hero" style="padding:12vh 0 6vh">
      <p class="lbl" data-reveal>Curriculum vitae</p>
      <h1 data-reveal style="--d:1;font-size:clamp(48px,7vw,88px)">Weiji Xie</h1>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </section>
    <div class="cvl" id="cv"></div>
    <footer>© <span id="yr"></span> Weiji Xie</footer>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="flock.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (k, v) => `<div class="row"><time>${esc(k)}</time><div>${v}</div></div>`;
  const ent = (e) => row(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  const sec = (t, rows) => `<section class="blk"><p class="lbl" data-reveal>${t}</p><div data-reveal>${rows}</div></section>`;
  $("cv").innerHTML = sec("Education", S.education.map(ent).join("")) + sec("Experience", S.experience.map(ent).join("")) +
    sec("Publications", S.publications.map((p) => row(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small>${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")) +
    sec("Honors", S.honors.map((h) => row(String(h.year), esc(h.text))).join("")) + sec("Service &amp; misc", S.service.map((s) => row("Service", esc(s))).join("") + S.misc.map((m) => row(m.k, esc(m.v))).join(""));
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
  Flock.start($("flock"), 110);
})();
</script>
</body>
</html>
