<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie</title>
<meta name="description" content="Weiji Xie: robot learning, reinforcement learning, embodied AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="light" id="light" aria-hidden="true"></canvas>
<main class="mosaic" id="mosaic">
  <div class="t s12 bar" style="--k:0"><a class="nm" href="#">Weiji Xie</a><nav aria-label="Site"><a href="#research">Research</a><a href="cv.html">CV</a></nav></div>
  <div class="t s7 r2 name" style="--k:1"><div class="lab">Hello</div><h1>Weiji<br>Xie</h1><div class="tg" id="tagline"></div></div>
  <div class="t s2 r2 photo" style="--k:2"><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
  <div class="t s3 r2 stmt" style="--k:3"><div class="lab">What I'm after</div><p id="statement"></p></div>
  <div class="t s7 aff" style="--k:4" id="aff"></div>
  <div class="t s5" style="--k:5"><div class="contacts" id="contacts"></div></div>
  <div id="news" style="display:contents"></div>
  <div class="t s12 filter" style="--k:12" id="research"><span class="lab">Research</span><div class="tabs" id="tabs"></div><span class="lab" style="margin-left:auto">* equal · † corresponding</span></div>
  <div id="pubs" style="display:contents"></div>
  <div class="t s4 path" style="--k:20"><div class="lab">Education</div><div id="edu"></div></div>
  <div class="t s4 path" style="--k:21"><div class="lab">Experience</div><div id="exp"></div></div>
  <div class="t s4 cvtile" style="--k:22"><div class="lab">More</div><a href="cv.html">Curriculum vitae →</a><small>education, publications, honors</small></div>
  <div class="t s12 foot" style="--k:23">© <span id="yr"></span> Weiji Xie · hand-built, no template</div>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="light.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("tagline").textContent = P.tagline;
  $("statement").textContent = P.statement;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  const spans = ["s4", "s4", "s4", "s6", "s6"];
  $("news").innerHTML = S.news.map((n, i) => `<div class="t ${spans[i % spans.length]} news" style="--k:${6 + i}"><time>${n.date}</time><div>${esc(n.text)}</div></div>`).join("");
  const r = (e) => `<div class="r"><time>${e.when}</time>${esc(e.title)} · ${esc(e.org)}</div>`;
  $("edu").innerHTML = S.education.map(r).join(""); $("exp").innerHTML = S.experience.map(r).join("");
  $("yr").textContent = new Date().getFullYear();
  // 前两张更大，其余三列
  const card = (p, i) => `<article class="t ${i < 2 ? "s6" : "s4"} work" data-hover>${media(p)}<div class="in"><div class="m"><span>${esc(venue(p))}</span><span>${p.date || p.year}</span></div><h3>${esc(p.short)}</h3><p>${esc(p.note)}</p><div class="au">${me(p.authors)}</div><div class="ln">${links(p)}</div></div></article>`;
  Site.tabs($("tabs"), (f) => Site.renderPubs($("pubs"), f, card));
  Site.init();
  Light($("light"));
  Magnet($("mosaic"));
})();
</script>
</body>
</html>
