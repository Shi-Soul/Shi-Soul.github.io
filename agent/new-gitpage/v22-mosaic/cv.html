<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="light" id="light" aria-hidden="true"></canvas>
<main class="mosaic" id="mosaic">
  <div class="t s12 bar" style="--k:0"><a class="nm" href="index.html">Weiji Xie</a><nav aria-label="Site"><a href="index.html#research">Research</a><a href="cv.html">CV</a></nav></div>
  <div class="t s8 name" style="--k:1"><div class="lab">Curriculum vitae</div><h1 style="font-size:clamp(44px,6vw,80px)">Weiji Xie</h1><div class="tg" id="aff"></div></div>
  <div class="t s4" style="--k:2"><div class="lab">Contact</div><div class="contacts" id="contacts"></div></div>
  <div id="cv" style="display:contents"></div>
  <div class="t s12 foot">© <span id="yr"></span> Weiji Xie</div>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="light.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (k, v) => `<div class="row"><time>${esc(k)}</time><div>${v}</div></div>`;
  const ent = (e) => row(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  const tile = (cls, k, t, body) => `<div class="t ${cls} cvt" style="--k:${k}"><div class="lab">${t}</div>${body}</div>`;
  $("cv").innerHTML = tile("s6", 3, "Education", S.education.map(ent).join("")) + tile("s6", 4, "Experience", S.experience.map(ent).join("")) +
    tile("s12", 5, "Publications", S.publications.map((p) => row(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small>${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")) +
    tile("s7", 6, "Honors", S.honors.map((h) => row(String(h.year), esc(h.text))).join("")) + tile("s5", 7, "Service &amp; misc", S.service.map((s) => row("Service", esc(s))).join("") + S.misc.map((m) => row(m.k, esc(m.v))).join(""));
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Light($("light"));
  Magnet($("mosaic"));
})();
</script>
</body>
</html>
