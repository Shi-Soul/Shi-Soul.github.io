<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="mark" href="index.html"><i aria-hidden="true"></i>Weiji Xie</a>
  <nav aria-label="Site"><a href="index.html#news">News</a><a href="index.html#publications">Publications</a><a href="cv.html" aria-current="page">CV</a></nav>
</div></header>

<main class="wrap">
  <div class="cvhead">
    <div class="minibadge" data-reveal><div class="photo" id="photo" role="img" aria-label="Photo of Weiji Xie"></div><b>Weiji Xie</b><span>Robot Learning</span></div>
    <div>
      <div class="kick" data-reveal>// curriculum vitae</div>
      <h1 data-reveal style="--d:1">Curriculum Vitae</h1>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </div>
  </div>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← Home</a></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (r) => `<div class="cvrow"><time>${esc(r.when || "")}</time><div><b>${esc(r.title)}</b>${r.org ? `<small>${esc(r.org)}</small>` : ""}${r.detail ? `<small>${esc(r.detail)}</small>` : ""}</div></div>`;
  const sec = (title, body, i) => `<section class="cvsec cvgrid" data-reveal><h2>${title}</h2><div>${body}</div></section>`;
  const blocks = Site.cvBlocks();
  const pubs = S.publications.map((p) => `<div class="cvpub" data-hover>${media(p)}<div><b>${esc(p.title)}</b><small>${me(p.authors)}</small><small>${esc(venue(p))}<span class="ln">${links(p)}</span></small></div></div>`).join("");
  $("cv").innerHTML = sec(blocks[0].title, blocks[0].rows.map(row).join("")) + sec(blocks[1].title, blocks[1].rows.map(row).join("")) +
    sec("Publications", pubs) + blocks.slice(2).map((b) => sec(b.title, b.rows.map(row).join(""))).join("");
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
