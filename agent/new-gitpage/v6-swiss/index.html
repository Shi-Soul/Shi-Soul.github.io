<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie</title>
<meta name="description" content="Weiji Xie: robot learning, reinforcement learning, embodied AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dot" id="dot" aria-hidden="true"></div>
<header class="top"><div class="wrap g"><a class="nm" href="#top">Weiji Xie</a><nav aria-label="Site"><a href="#news">News</a><a href="#publications">Publications</a><a href="cv.html">CV</a></nav></div></header>

<main id="top">
  <section class="wrap hero g">
    <figure class="idp" data-reveal><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div><figcaption>Shanghai · 35 × 45</figcaption></figure>
    <div class="name">
      <h1 id="h1" aria-label="Weiji Xie"></h1>
      <div class="sub">
        <div class="txt"><p class="tag" data-reveal id="tagline"></p><p class="st" data-reveal style="--d:1" id="statement"></p><p class="aff" data-reveal style="--d:2" id="aff"></p></div>
        <ul id="contacts" data-reveal style="--d:3"></ul>
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div id="mq"></div></div>

  <section class="wrap sec g" id="news">
    <div class="head" data-reveal><b>01</b><h2>News</h2></div>
    <div class="body"><ul class="news" id="news-list"></ul></div>
  </section>
  <div class="wrap"><div class="rule" data-rule></div></div>

  <section class="wrap sec g" id="publications">
    <div class="head" data-reveal><b>02</b><h2>Publications</h2></div>
    <div class="body"><div class="tabs" id="tabs"></div><div class="pubs" id="pubs"></div></div>
  </section>
  <div class="wrap"><div class="rule" data-rule></div></div>

  <section class="wrap sec g" id="path">
    <div class="head" data-reveal><b>03</b><h2>Path</h2></div>
    <div class="body">
      <div class="path"><div data-reveal><h3>Education</h3><div id="edu"></div></div><div data-reveal style="--d:1"><h3>Experience</h3><div id="exp"></div></div></div>
      <a class="more" href="cv.html">Full curriculum vitae →</a>
    </div>
  </section>
</main>
<footer><div class="wrap g"><span>© <span id="yr"></span> Weiji Xie</span><span>Robot learning</span></div></footer>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="swiss.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links, rest, catName } = Site, $ = (id) => document.getElementById(id);
  Swiss.name($("h1"));
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("tagline").textContent = P.tagline;
  $("statement").textContent = P.statement;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true }).split(/(?=<a |<button )/).map((x) => `<li>${x}</li>`).join("");
  const kw = ["Robot Learning", "Reinforcement Learning", "Embodied AI", "Sim-to-Real", "Motion Tracking", "Generative Models", "Multi-Agent", "General-Purpose Robots"];
  $("mq").innerHTML = kw.concat(kw).map((k) => `<span>${k}</span>`).join("");
  $("news-list").innerHTML = S.news.map((n, i) => `<li data-reveal style="--d:${i}"><time>${n.date}</time><span>${esc(n.text)}</span></li>`).join("");
  const r = (x) => `<div class="r"><time>${x.when}</time><div>${esc(x.title)}<small>${esc(x.org)}</small></div></div>`;
  $("edu").innerHTML = S.education.map(r).join(""); $("exp").innerHTML = S.experience.map(r).join("");
  $("yr").textContent = new Date().getFullYear();
  const card = (p) => `<article class="pub" data-hover>${media(p)}
    <div class="meta"><b>${isTop(p) ? esc(venue(p)) : "Preprint " + p.year}</b><span>${(p.cats || []).map(catName).join(" / ")}</span></div>
    <h3>${esc(p.short)}</h3><p class="full">${esc(rest(p))}</p><p class="note">${esc(p.note)}</p><div class="au">${me(p.authors)}</div><div class="lk">${links(p)}</div></article>`;
  Site.tabs($("tabs"), (f) => Site.renderPubs($("pubs"), f, card));
  Site.init();
  Site.reveal();
  Swiss.rules();
  Swiss.cursor($("dot"));
})();
</script>
</body>
</html>
