<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie</title>
<meta name="description" content="Weiji Xie: robot learning, reinforcement learning, embodied AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="agent" id="agent" aria-hidden="true"></canvas>
<main class="letter">
  <header class="top"><span>Shanghai</span><nav aria-label="Site"><a href="#lately">Lately</a><a href="#work">Work</a><a href="cv.html">CV</a></nav></header>

  <section class="opening">
    <div class="who" data-reveal><h1>Weiji Xie</h1><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
    <p class="st" data-reveal style="--d:1" id="statement"></p>
    <p class="aff" data-reveal style="--d:2" id="aff"></p>
    <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
  </section>

  <section id="lately"><h2 data-reveal>Lately</h2><ul class="lately" id="news"></ul></section>

  <section id="work"><h2 data-reveal>Work</h2><div class="filters" id="tabs"></div><div id="pubs"></div></section>

  <section class="path"><h2 data-reveal>Path</h2><div id="path" data-reveal></div><p style="margin-top:14px"><a href="cv.html">The full CV</a></p></section>

  <p class="sign" data-reveal>Thanks for reading.<small id="yr"></small></p>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="agent.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("statement").textContent = P.statement;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  $("news").innerHTML = S.news.map((n, i) => `<li data-reveal style="--d:${i}"><time>${n.date}</time>${esc(n.text)}</li>`).join("");
  $("path").innerHTML = S.education.concat(S.experience).map((e) => `<p><time>${e.when}</time>${esc(e.title)}, ${esc(e.org)}</p>`).join("");
  $("yr").textContent = `Weiji Xie · ${new Date().getFullYear()}`;
  const card = (p) => `<div class="work" data-hover>${media(p)}<div><h3>${esc(p.short)} <span class="v">· ${esc(venue(p))}</span></h3><p>${esc(p.note)}</p><div class="au">${me(p.authors)}</div><div class="ln">${links(p)}</div></div></div>`;
  Site.tabs($("tabs"), (f) => Site.renderPubs($("pubs"), f, card));
  Site.init();
  Site.reveal();
  Agent($("agent"));
})();
</script>
</body>
</html>
