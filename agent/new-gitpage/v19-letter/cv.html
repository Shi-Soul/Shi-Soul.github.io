<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="agent" id="agent" aria-hidden="true"></canvas>
<main class="letter">
  <header class="top"><a href="index.html" style="margin:0">← Weiji Xie</a><nav aria-label="Site"><a href="index.html#lately">Lately</a><a href="index.html#work">Work</a><a href="cv.html" aria-current="page">CV</a></nav></header>
  <section class="opening" style="padding:12vh 0 4vh">
    <h1 data-reveal>Curriculum Vitae</h1>
    <p class="aff" data-reveal style="--d:1;margin-top:24px" id="aff"></p>
    <div class="contacts" data-reveal style="--d:2" id="contacts"></div>
  </section>
  <div class="cv" id="cv"></div>
  <p class="sign" data-reveal><small id="yr"></small></p>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="agent.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (k, v) => `<div class="row"><time>${esc(k)}</time><div>${v}</div></div>`;
  const sec = (t, rows) => `<section><h2 data-reveal>${t}</h2><div data-reveal>${rows}</div></section>`;
  const ent = (e) => row(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  $("cv").innerHTML = sec("Education", S.education.map(ent).join("")) + sec("Experience", S.experience.map(ent).join("")) +
    sec("Publications", S.publications.map((p) => row(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small>${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")) +
    sec("Honors", S.honors.map((h) => row(String(h.year), esc(h.text))).join("")) +
    sec("Service &amp; misc", S.service.map((s) => row("Service", esc(s))).join("") + S.misc.map((m) => row(m.k, esc(m.v))).join(""));
  $("yr").textContent = `Weiji Xie · ${new Date().getFullYear()}`;
  Site.init();
  Site.reveal();
  Agent($("agent"));
})();
</script>
</body>
</html>
