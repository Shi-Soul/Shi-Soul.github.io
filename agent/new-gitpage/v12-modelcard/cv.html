<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head" id="head"></header>
<div class="wrap layout">
  <main class="md">
    <h1>Training details</h1>
    <p style="color:var(--muted)">Curriculum vitae of Weiji Xie.</p>
    <h2>Education</h2><table><tbody id="edu"></tbody></table>
    <h2>Experience</h2><table><tbody id="exp"></tbody></table>
    <h2>Evaluation results (all publications)</h2><table><tbody id="pubs"></tbody></table>
    <h2>Honors &amp; awards</h2><table><tbody id="honors"></tbody></table>
    <h2>Service &amp; misc</h2><table><tbody id="misc"></tbody></table>
  </main>
  <aside class="side" id="side" aria-label="Profile"></aside>
</div>
<div class="wrap"><footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← Model card</a></footer></div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="card.js"></script>
<script>
(function () {
  const { S, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  Card.head($("head"), "cv"); Card.side($("side"));
  const row = (k, v) => `<tr><th style="font:13px var(--mono)">${esc(k)}</th><td>${v}</td></tr>`;
  const ent = (e) => row(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  $("edu").innerHTML = S.education.map(ent).join("");
  $("exp").innerHTML = S.experience.map(ent).join("");
  $("pubs").innerHTML = S.publications.map((p) => row(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small style="font:12px var(--mono)">${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("");
  $("honors").innerHTML = S.honors.map((h) => row(String(h.year), esc(h.text))).join("");
  $("misc").innerHTML = S.service.map((s) => row("Service", esc(s))).join("") + S.misc.map((m) => row(m.k, esc(m.v))).join("");
  $("yr").textContent = new Date().getFullYear();
  Site.init();
})();
</script>
</body>
</html>
