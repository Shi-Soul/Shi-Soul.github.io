<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><div class="in">
  <span class="file"><i class="fa-solid fa-book"></i>cv.ipynb</span>
  <nav aria-label="Site"><a href="index.html">weiji_xie.ipynb</a><a href="cv.html" aria-current="page">cv.ipynb</a></nav>
  <span class="kernel" id="kernel"><i aria-hidden="true"></i> idle</span>
</div></header>

<main class="nb">
  <div class="cell md-cell"><div class="prompt"></div><div class="md"><h1>Curriculum Vitae</h1><div class="tag">Weiji Xie · robot learning</div>
    <div class="contacts" id="contacts" style="margin-top:12px"></div></div></div>
  <div class="cell" data-code><div class="prompt">In [ ]:</div><div class="src">cv.education</div><div class="prompt o"></div><div class="out" id="edu"></div></div>
  <div class="cell" data-code><div class="prompt">In [ ]:</div><div class="src">cv.experience</div><div class="prompt o"></div><div class="out" id="exp"></div></div>
  <div class="cell" data-code><div class="prompt">In [ ]:</div><div class="src">cv.publications(view="all")</div><div class="prompt o"></div><div class="out" id="pubs"></div></div>
  <div class="cell" data-code><div class="prompt">In [ ]:</div><div class="src">cv.honors</div><div class="prompt o"></div><div class="out" id="honors"></div></div>
  <div class="cell" data-code><div class="prompt">In [ ]:</div><div class="src">cv.service + cv.misc</div><div class="prompt o"></div><div class="out" id="misc"></div></div>
</main>
<footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← weiji_xie.ipynb</a></footer>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="nb.js"></script>
<script>
(function () {
  const { S, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const ent = (e) => [e.when, esc(e.title) + (e.detail ? `<small>${esc(e.detail)}</small>` : ""), esc(e.org)];
  $("edu").innerHTML = NB.df(["period", "degree", "institution"], S.education.map(ent));
  $("exp").innerHTML = NB.df(["period", "role", "institution"], S.experience.map(ent));
  $("pubs").innerHTML = NB.df(["venue", "title / authors", "links"], S.publications.map((p) => [esc(venue(p)), esc(p.title) + `<small>${me(p.authors)}</small>`, `<span style="font:12.5px var(--mono)">${links(p).replace(/<\/a><a/g, "</a> · <a")}</span>`]));
  $("honors").innerHTML = NB.df(["year", "honor"], S.honors.map((h) => [String(h.year), esc(h.text)]));
  $("misc").innerHTML = NB.df(["item", "detail"], S.service.map((s) => ["service", esc(s)]).concat(S.misc.map((m) => [m.k.toLowerCase(), esc(m.v)])));
  $("yr").textContent = new Date().getFullYear();
  NB.fill();
  Site.init();
  NB.run($("kernel"));
})();
</script>
</body>
</html>
