<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="nm" href="index.html">weiji-xie</a><nav aria-label="Site"><a href="index.html#tags">tags</a><a href="index.html#log">log</a><a href="cv.html" aria-current="page">cv</a></nav></header>
  <section class="hero" style="grid-template-columns:1fr">
    <div>
      <div class="who" data-reveal><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div><h1>Curriculum Vitae</h1></div>
      <p class="credo" data-reveal style="--d:1">$ git show cv: the full history so far.</p>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </div>
  </section>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← git log</a></footer>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="git.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const r = (h, k, v) => `<div class="r"><code>${h}</code><time>${esc(k)}</time><div>${v}</div></div>`;
  const ent = (e) => r(Git.hash(e.title + e.org), e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  const sec = (cmd, body) => `<section class="blk"><p class="cmd" data-reveal>$ <b>${cmd}</b></p><div class="tags rows" data-reveal>${body}</div></section>`;
  $("cv").innerHTML = sec("git log career/education", S.education.map(ent).join("")) + sec("git log career/experience", S.experience.map(ent).join("")) +
    sec("git log research --all", S.publications.map((p) => r(Git.hash(p.title), venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small style="font:12px var(--mono)">${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")) +
    sec("git tag -l honors/*", S.honors.map((h) => r("v" + h.year, String(h.year), esc(h.text))).join("")) +
    sec("git config --list", S.service.map((s) => r("service", "", esc(s))).join("") + S.misc.map((m) => r(m.k.toLowerCase(), "", esc(m.v))).join(""));
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
