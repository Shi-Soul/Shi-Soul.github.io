<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie</title>
<meta name="description" content="Weiji Xie: robot learning, reinforcement learning, embodied AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="ink" id="ink" aria-hidden="true"></canvas>
<div class="layout">
  <aside class="side">
    <div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div>
    <h1>Weiji Xie</h1>
    <div class="tg" id="tagline"></div>
    <p class="st" id="statement"></p>
    <p class="aff" id="aff"></p>
    <div class="contacts" id="contacts"></div>
    <h4>Index</h4>
    <nav aria-label="Site"><a href="#lately">Lately</a><a href="#work">Work</a><a href="#path">Path</a><a href="cv.html">Curriculum vitae</a></nav>
    <h4>View</h4>
    <div class="tabs" id="tabs"></div>
    <div class="foot">© <span id="yr"></span> Weiji Xie</div>
  </aside>
  <main class="main">
    <section id="lately"><p class="lbl">Lately</p><div class="lately" id="news"></div></section>
    <section id="work"><p class="lbl">Work · * equal contribution · † corresponding</p><div id="pubs"></div></section>
    <section id="path"><p class="lbl">Path</p><div class="path" id="path-list"></div></section>
  </main>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="ink.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links, rest } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("tagline").textContent = P.tagline;
  $("statement").textContent = P.statement;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  $("news").innerHTML = S.news.map((n) => `<div data-reveal><time>${n.date}</time>${esc(n.text)}</div>`).join("");
  $("path-list").innerHTML = S.education.concat(S.experience).map((e) => `<div data-reveal><time>${e.when}</time>${esc(e.title)}<small>${esc(e.org)}</small></div>`).join("");
  $("yr").textContent = new Date().getFullYear();
  const card = (p) => `<article class="piece" data-hover>${media(p)}<div class="cap"><div><h3>${esc(p.short)}</h3><div class="v">${esc(venue(p))}</div></div>
    <div><p>${esc(p.note)}</p><p class="full">${esc(rest(p))}</p><div class="au">${me(p.authors)}</div><div class="ln">${links(p)}</div></div></div></article>`;
  Site.tabs($("tabs"), (f) => Site.renderPubs($("pubs"), f, card));
  Site.init();
  Site.reveal();
  Ink($("ink"));
})();
</script>
</body>
</html>
