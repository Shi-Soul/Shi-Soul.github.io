<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="ink" id="ink" aria-hidden="true"></canvas>
<div class="layout">
  <aside class="side">
    <div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div>
    <h1>Weiji Xie</h1>
    <div class="tg">Curriculum vitae</div>
    <p class="aff" id="aff" style="margin-top:18px"></p>
    <div class="contacts" id="contacts"></div>
    <h4>Index</h4>
    <nav aria-label="Site"><a href="index.html#lately">Lately</a><a href="index.html#work">Work</a><a href="index.html#path">Path</a><a href="cv.html" aria-current="page">Curriculum vitae</a></nav>
    <div class="foot">© <span id="yr"></span> Weiji Xie</div>
  </aside>
  <main class="main"><div class="cvrows" id="cv"></div></main>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="ink.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (k, v) => `<div class="row"><time>${esc(k)}</time><div>${v}</div></div>`;
  const ent = (e) => row(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  $("cv").innerHTML = `<h2>Education</h2>${S.education.map(ent).join("")}<h2>Experience</h2>${S.experience.map(ent).join("")}` +
    `<h2>Publications</h2>${S.publications.map((p) => row(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small>${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")}` +
    `<h2>Honors</h2>${S.honors.map((h) => row(String(h.year), esc(h.text))).join("")}<h2>Service &amp; misc</h2>${S.service.map((s) => row("Service", esc(s))).join("")}${S.misc.map((m) => row(m.k, esc(m.v))).join("")}`;
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Ink($("ink"));
})();
</script>
</body>
</html>
