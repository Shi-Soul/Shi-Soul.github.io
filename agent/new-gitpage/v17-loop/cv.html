<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="nm" href="index.html">Weiji Xie</a><nav aria-label="Site"><a href="index.html#rewards">Rewards</a><a href="index.html#rollouts">Rollouts</a><a href="cv.html" aria-current="page">CV</a></nav></header>
  <section style="padding:30px 0 10px">
    <h1 data-reveal style="font:400 clamp(48px,6vw,72px)/1 var(--serif);margin:0 0 10px">Curriculum Vitae</h1>
    <p class="credo" data-reveal style="--d:1">The full trajectory so far.</p>
    <p class="aff" data-reveal style="--d:2" id="aff"></p>
    <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
  </section>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← back to the loop</a></footer>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, links } = Site, $ = (id) => document.getElementById(id);
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const r = (k, v) => `<div class="r"><time>${esc(k)}</time><div>${v}</div></div>`;
  const ent = (e) => r(e.when, `${esc(e.title)}<small>${esc(e.org)}${e.detail ? " · " + esc(e.detail) : ""}</small>`);
  const sec = (t, m, body) => `<section class="blk"><div class="sh" data-reveal><h2>${t}</h2><span class="m">${m}</span></div><div class="rows" data-reveal>${body}</div></section>`;
  $("cv").innerHTML = sec("Education", "policy updates", S.education.map(ent).join("")) + sec("Experience", "policy updates", S.experience.map(ent).join("")) +
    sec("Publications", "all rollouts", S.publications.map((p) => r(venue(p), `${esc(p.title)}<small>${me(p.authors)}</small><small style="font:12px var(--mono)">${links(p).replace(/<\/a><a/g, "</a> · <a")}</small>`)).join("")) +
    sec("Honors &amp; Awards", "reward signals", S.honors.map((h) => r(String(h.year), esc(h.text))).join("")) +
    sec("Service &amp; Misc", "", S.service.map((s) => r("Service", esc(s))).join("") + S.misc.map((m) => r(m.k, esc(m.v))).join(""));
  $("yr").textContent = new Date().getFullYear();
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
