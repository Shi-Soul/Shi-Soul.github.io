<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav solid"><div class="wrap">
  <a class="mark" href="index.html"><i aria-hidden="true"></i>Weiji Xie</a>
  <nav aria-label="Site"><a href="index.html#news">News</a><a href="index.html#publications">Publications</a><a href="cv.html" aria-current="page">CV</a></nav>
</div></header>

<div class="cvband">
  <canvas id="flow" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="avatar" data-reveal><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
    <div><div class="kick" data-reveal style="--d:1">Curriculum vitae</div><h1 data-reveal style="--d:2">Weiji <span class="grad">Xie</span></h1></div>
  </div>
</div>

<main class="wrap">
  <p class="aff" data-reveal id="aff" style="margin-top:8px"></p>
  <div class="contacts" data-reveal style="--d:1" id="contacts"></div>
  <div id="cv" style="margin-top:36px"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><a href="index.html">← Home</a></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="flow.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const row = (r) => `<div class="cvrow"><time>${esc(r.when || "")}</time><div><b>${esc(r.title)}</b>${r.org ? `<small>${esc(r.org)}</small>` : ""}${r.detail ? `<small>${esc(r.detail)}</small>` : ""}</div></div>`;
  const sec = (t, body) => `<section class="cvsec" data-reveal><h2>${t}</h2><div>${body}</div></section>`;
  const b = Site.cvBlocks();
  const pubs = S.publications.map((p) => `<div class="cvpub" data-hover>${media(p)}<div><b>${esc(p.title)}</b><small>${me(p.authors)}</small><small>${esc(venue(p))}<span class="ln">${links(p)}</span></small></div></div>`).join("");
  $("cv").innerHTML = sec(b[0].title, b[0].rows.map(row).join("")) + sec(b[1].title, b[1].rows.map(row).join("")) + sec("Publications", pubs) + b.slice(2).map((x) => sec(x.title, x.rows.map(row).join(""))).join("");
  $("yr").textContent = new Date().getFullYear();
  Flow($("flow"), { max: 700 });
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
