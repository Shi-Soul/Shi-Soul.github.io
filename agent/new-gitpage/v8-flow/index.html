<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie</title>
<meta name="description" content="Weiji Xie: robot learning, reinforcement learning, embodied AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav" id="nav"><div class="wrap">
  <a class="mark" href="#top"><i aria-hidden="true"></i>Weiji Xie</a>
  <nav aria-label="Site"><a href="#news">News</a><a href="#publications">Publications</a><a href="cv.html">CV</a></nav>
</div></header>

<div class="hero" id="top">
  <canvas id="flow" aria-hidden="true"></canvas>
  <div class="wrap">
    <div>
      <div class="kick" data-reveal id="tagline"></div>
      <h1 data-reveal style="--d:1">Weiji <span class="grad">Xie</span></h1>
      <p class="statement" data-reveal style="--d:2" id="statement"></p>
      <p class="aff" data-reveal style="--d:3" id="aff"></p>
      <div class="contacts" data-reveal style="--d:4" id="contacts"></div>
    </div>
    <div class="avatar" data-reveal style="--d:2"><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
  </div>
  <div class="scroll-hint" aria-hidden="true">SCROLL</div>
</div>

<main class="wrap">
  <section class="blk" id="news">
    <div class="sh" data-reveal><h2>News</h2></div>
    <div class="news" id="news-list"></div>
  </section>

  <section class="blk" id="publications">
    <div class="sh" data-reveal><h2>Publications</h2><span class="aside">* equal contribution · † corresponding</span></div>
    <div class="tabs" id="tabs" data-reveal></div>
    <div class="pubs" id="pubs"></div>
  </section>

  <section class="blk" id="path">
    <div class="sh" data-reveal><h2>Path</h2></div>
    <div class="path">
      <div class="panel" data-reveal><h3>Education</h3><div id="edu"></div></div>
      <div class="panel" data-reveal style="--d:1"><h3>Experience</h3><div id="exp"></div></div>
    </div>
    <a class="more" href="cv.html">Full CV →</a>
  </section>

  <footer><span>© <span id="yr"></span> Weiji Xie</span><span>hand-built, no template</span></footer>
</main>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script src="flow.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links, rest, catName } = Site, $ = (id) => document.getElementById(id);
  $("tagline").textContent = P.tagline;
  $("statement").textContent = P.statement;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true });
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("news-list").innerHTML = S.news.map((n, i) => `<div data-reveal style="--d:${i}"><time>${n.date}</time><span>${esc(n.text)}</span></div>`).join("");
  const r = (x) => `<div class="r"><time>${x.when}</time><b>${esc(x.title)}</b><small>${esc(x.org)}</small></div>`;
  $("edu").innerHTML = S.education.map(r).join(""); $("exp").innerHTML = S.experience.map(r).join("");
  $("yr").textContent = new Date().getFullYear();
  const card = (p) => `<article class="pub" data-hover>${media(p)}<div class="body">
      <div class="row"><span class="venue ${isTop(p) ? "top" : ""}">${esc(venue(p))}</span><span class="cats">${(p.cats || []).map(catName).join(" · ")}</span></div>
      <h3>${esc(p.short)}</h3><p class="full">${esc(rest(p))}</p><p class="note">${esc(p.note)}</p><div class="au">${me(p.authors)}</div><div class="ln">${links(p)}</div></div></article>`;
  Site.tabs($("tabs"), (f) => Site.renderPubs($("pubs"), f, card));
  Spotlight($("pubs"));
  Flow($("flow"));
  const nav = $("nav"); const solid = () => nav.classList.toggle("solid", window.scrollY > 40); solid(); window.addEventListener("scroll", solid, { passive: true });
  Site.init();
  Site.reveal();
})();
</script>
</body>
</html>
