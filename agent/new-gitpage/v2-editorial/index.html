<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiji Xie · Research Review</title>
<meta name="description" content="Weiji Xie: humanoid whole-body control, reinforcement learning, robotics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="../shared/site.css">
<style>
:root {
  --paper: #f6f2ea; --paper2: #ece4d6; --ink: #1c1915; --ink2: #4a443c; --muted: #857c70; --rule: #d9d1c3; --red: #c8381c; --red-ink: #a52c14;
  --serif: "Fraunces", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "PingFang SC", sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --pm-bg: var(--paper2); --pm-ph-bg: var(--paper2); --pm-ph-ink: var(--muted);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #15130f; --paper2: #221e18; --ink: #efe9dd; --ink2: #c8c0b2; --muted: #8f8676; --rule: #3a342b; --red: #ff6a45; --red-ink: #ff8a6b; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #15130f; --paper2: #221e18; --ink: #efe9dd; --ink2: #c8c0b2; --muted: #8f8676; --rule: #3a342b; --red: #ff6a45; --red-ink: #ff8a6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { color: var(--red-ink); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
.kicker, .sec-title { font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sec-title { color: var(--red-ink); font-size: 13px; }

.mast { border-bottom: 3px double var(--ink); }
.mast .wrap { display: flex; align-items: center; justify-content: space-between; height: 54px; }
.mast .title { font: italic 600 18px var(--serif); text-decoration: none; }
.theme { background: none; border: 1px solid var(--rule); border-radius: 50%; width: 30px; height: 30px; color: var(--ink2); cursor: pointer; }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; padding: 52px 0 44px; border-bottom: 1px solid var(--rule); align-items: end; }
.hero h1 { font: 700 clamp(64px, 12vw, 164px)/.86 var(--serif); letter-spacing: -.055em; margin: 18px 0 0; font-variation-settings: "opsz" 144; position: relative; }
.hero h1 i { font-weight: 300; color: var(--red); }
.seal { position: absolute; right: 2%; top: 4%; writing-mode: vertical-rl; font: 900 28px/1.05 "Noto Serif SC", serif; color: var(--paper); background: var(--red); padding: 12px 8px; border-radius: 4px; letter-spacing: .08em; transform: rotate(4deg); box-shadow: inset 0 0 0 3px var(--red), inset 0 0 0 5px var(--paper); }
.dek { font: italic 400 clamp(21px, 2.4vw, 28px)/1.3 var(--serif); color: var(--ink2); margin: 26px 0 0; max-width: 680px; }
.contacts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px; font-size: 19px; }
.contacts a, .contacts button { color: var(--ink2); text-decoration: none; }
.contacts a:hover, .contacts button:hover { color: var(--red); }
/* 彩色证件照：亮色下用正片叠底把白底融进纸色，像杂志人像而不是证件照 */
.portrait { margin: 0; }
.portrait .img { aspect-ratio: 4 / 5; background: var(--paper2) center 30% / cover no-repeat; background-blend-mode: multiply; border-radius: 2px; position: relative; }
.portrait .img::before { content: ""; position: absolute; left: -14px; bottom: -14px; width: 46%; height: 46%; background: var(--red); z-index: -1; }
:root[data-theme="dark"] .portrait .img { background-blend-mode: normal; outline: 6px solid var(--ink); outline-offset: -1px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .portrait .img { background-blend-mode: normal; outline: 6px solid var(--ink); outline-offset: -1px; } }
.portrait figcaption { font: italic 13.5px var(--serif); color: var(--muted); margin-top: 22px; }
.portrait figcaption span { display: block; }

.features { padding: 18px 0 8px; }
.feat { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 44px; padding: 36px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.feat:nth-child(even) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.feat:nth-child(even) .pm { order: 2; }
.feat .pm { aspect-ratio: 16 / 9; border: 1px solid var(--rule); }
.feat .no { font: 300 52px/1 var(--serif); color: var(--red); }
.feat .venue { font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); margin-top: 8px; }
.feat .venue b { background: var(--ink); color: var(--paper); padding: 2px 7px; margin-right: 8px; font-weight: 500; }
.feat h3 { font: 600 clamp(28px, 3vw, 38px)/1.08 var(--serif); letter-spacing: -.02em; margin: 12px 0 8px; }
.feat .note { font: italic 400 19px/1.45 var(--serif); color: var(--ink2); margin: 0 0 14px; }
.feat .acts { display: flex; gap: 20px; font: 500 13px var(--mono); }

.lower { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; padding: 44px 0; border-bottom: 1px solid var(--rule); }
.also { list-style: none; margin: 14px 0 0; padding: 0; }
.also li { padding: 12px 0; border-top: 1px solid var(--rule); }
.also .t { font: 500 17px/1.35 var(--serif); }
.also small { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.also .me { color: var(--ink); }
.also .acts { font: 12px var(--mono); margin-left: 10px; }
.also .acts a { margin-right: 10px; }
.disp { list-style: none; padding: 0; margin: 14px 0 0; }
.disp li { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.disp time { font: 12.5px var(--mono); color: var(--red-ink); padding-top: 2px; }

footer { padding: 22px 0 56px; }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; font: 13px var(--mono); color: var(--muted); }
footer .cv span { margin-right: 18px; }

@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; gap: 36px; }
  .portrait { max-width: 280px; margin-left: 14px; }
  .feat, .feat:nth-child(even) { grid-template-columns: 1fr; gap: 20px; }
  .feat:nth-child(even) .pm { order: 0; }
  .lower { grid-template-columns: 1fr; gap: 40px; }
}
@media (max-width: 600px) { .wrap { padding: 0 16px; } .seal { font-size: 19px; padding: 8px 5px; right: 0; top: -6px; } }
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="title" href="#top">Weiji Xie, <span style="font-weight:400">a research review</span></a>
  <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">◐</button>
</div></header>

<main class="wrap" id="top">
  <section class="hero">
    <div>
      <div class="kicker" id="tagline"></div>
      <h1>Weiji<br><i>Xie</i><span class="seal" aria-label="谢炜基">谢炜基</span></h1>
      <p class="dek">builds humanoids that balance, fight, dance, and do what you tell them.</p>
      <div class="contacts" id="contacts"></div>
    </div>
    <figure class="portrait">
      <div class="img" id="photo" role="img" aria-label="Portrait of Weiji Xie"></div>
      <figcaption id="bio"></figcaption>
    </figure>
  </section>

  <section class="features" id="work" aria-label="Main work"></section>

  <section class="lower">
    <div><div class="sec-title">Also</div><ul class="also" id="also"></ul></div>
    <div><div class="sec-title">Dispatches</div><ul class="disp" id="news"></ul></div>
  </section>
</main>
<footer><div class="wrap"><span class="cv" id="cv"></span><span>Hand-built, no template.</span></div></footer>

<script src="../shared/data.js"></script>
<script src="../shared/site.js"></script>
<script src="../shared/switcher.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, isTop, media, links } = Site, $ = (id) => document.getElementById(id);
  $("tagline").textContent = P.tagline;
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("bio").innerHTML = P.bio;
  $("contacts").innerHTML = Site.contacts();

  const roman = ["I", "II", "III", "IV", "V"];
  $("work").innerHTML = Site.main().map((p, i) => `<article class="feat" data-hover>${media(p)}
    <div><div class="no">${roman[i]}.</div>
      <div class="venue">${isTop(p) ? `<b>${esc(p.venue)}</b>${p.year}` : `<b>Preprint</b>under review`}</div>
      <h3 title="${esc(p.title)}">${esc(p.short)}</h3><p class="note">${esc(p.note)}</p>
      <div class="acts">${links(p, { project: "Project →", pdf: "Paper →" })}</div></div></article>`).join("");
  $("also").innerHTML = Site.others().map((p) => `<li><span class="t">${esc(p.title)}</span><small>${me(p.authors)} · ${esc(venue(p))}<span class="acts">${links(p)}</span></small></li>`).join("");
  $("news").innerHTML = S.news.map((n) => `<li><time>${n.date}</time><span>${esc(n.text)}</span></li>`).join("");
  $("cv").innerHTML = S.cv.map((c) => `<span>${c.when} ${esc(c.what)}</span>`).join("") + `<a href="${P.cv}">Full CV →</a>`;
  Site.init();
  Site.themeToggle($("theme"));
})();
</script>
</body>
</html>
