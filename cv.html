<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Reveal text once, with its final fonts. On a slow/failed load, keep the fallback for this visit.
(function () {
  if (!document.fonts) return;
  const html = document.documentElement;
  html.classList.add("fonts-pending");
  window.fontsReady = new Promise((resolve) => {
    const finish = (fallback) => {
      if (!html.classList.contains("fonts-pending")) return;
      clearTimeout(timeout);
      html.classList.toggle("fonts-fallback", fallback);
      html.classList.remove("fonts-pending");
      resolve();
    };
    const timeout = setTimeout(() => finish(true), 3000);
    document.addEventListener("DOMContentLoaded", () => {
      const faces = ['400 20px "Source Serif 4"', '600 20px "Source Serif 4"', '700 66px "Source Serif 4"',
        'italic 400 16px "Source Serif 4"', '400 22px "Patrick Hand"', '400 15px "IBM Plex Mono"', '500 13px "IBM Plex Mono"'];
      Promise.all(faces.map((face) => document.fonts.load(face, "Weiji Xie")))
        .then(() => document.fonts.ready).then(() => finish(false), () => finish(true));
    }, { once: true });
  });
})();
</script>
<title>CV · Weiji Xie</title>
<meta name="description" content="Curriculum vitae of Weiji Xie.">
<link rel="canonical" href="https://shi-soul.github.io/cv.html">
<link rel="preload" href="media/fonts/source-serif-4-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="media/fonts/patrick-hand-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="media/fonts/ibm-plex-mono-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="media/fonts/text.css">
<link rel="stylesheet" href="media/fonts/fontawesome.css">
<link rel="stylesheet" href="media/fonts/academicons.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="page">
  <a class="sig" href="index.html">Weiji Xie ✎</a>
  <nav aria-label="Site"><a href="index.html#news">news</a><a href="index.html#publications">publications</a><a href="cv.html" aria-current="page">cv</a></nav>
</div></header>

<main class="page">
  <section class="cvhead">
    <div>
      <div class="tagline" data-reveal>curriculum vitae</div>
      <h1 data-reveal style="--d:1">Weiji Xie</h1>
      <p class="aff" data-reveal style="--d:2" id="aff"></p>
      <div class="contacts" data-reveal style="--d:3" id="contacts"></div>
    </div>
    <div class="passport"><div class="img" id="photo" role="img" aria-label="Photo of Weiji Xie"></div></div>
  </section>
  <div id="cv"></div>
  <footer><span>© <span id="yr"></span> Weiji Xie</span><span>Last updated: <time id="updated"></time></span><a href="index.html">← back home</a></footer>
</main>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  const { S, P, esc, me, venue, media, links } = Site, $ = (id) => document.getElementById(id);
  $("photo").style.backgroundImage = `url(${P.photo})`;
  $("aff").innerHTML = P.affiliation;
  $("contacts").innerHTML = Site.contacts({ labels: true, emailText: true });
  const paths = ["M2 9 C 25 3, 50 13, 98 5", "M2 6 C 30 12, 60 2, 98 8", "M2 8 C 30 3, 70 12, 98 6"];
  const h2 = (t, i) => `<h2 data-reveal><span class="u">${t}<svg viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><path d="${paths[i % 3]}"/></svg></span></h2>`;
  const row = (r) => `<div class="cvrow"><time>${esc(r.when || "")}</time><div>${r.org ? `<b class="org">${esc(r.org)}</b><span class="pos">${esc(r.title)}</span>` : esc(r.title)}${r.advisor ? `<small>${r.advisor.role}: <a href="${r.advisor.url}">${esc(r.advisor.name)}</a></small>` : ""}${r.detail ? `<small>${esc(r.detail)}</small>` : ""}</div></div>`;
  const sec = (t, body, i) => `<section class="cvsec">${h2(t, i)}<div data-reveal style="--d:1">${body}</div></section>`;
  const b = Site.cvBlocks();
  const pubs = S.publications.map((p) => `<div class="cvpub" data-hover>${media(p)}<div>${esc(p.title)}<small>${me(p.authors)}</small><small>${esc(venue(p))}<span class="acts">${links(p, { project: "project", pdf: "paper", code: "code" })}</span></small></div></div>`).join("");
  $("cv").innerHTML = sec(b[0].title, b[0].rows.map(row).join(""), 0) + sec(b[1].title, b[1].rows.map(row).join(""), 1) + sec("Publications", pubs, 2) +
    b.slice(2).map((x, i) => sec(x.title, x.rows.map(row).join(""), i)).join("");
  $("yr").textContent = new Date().getFullYear();
  $("updated").dateTime = S.lastUpdated;
  $("updated").textContent = new Date(`${S.lastUpdated}T00:00:00Z`).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
  Site.init();
  Promise.resolve(window.fontsReady).then(() => Site.reveal());
})();
</script>
</body>
</html>
